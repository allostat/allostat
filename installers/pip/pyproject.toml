[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allostat"
version = "0.1.0"
description = "Installer for Allostat — a folder of canonical context files plus session routines that keep the context your AI works from sharp, consistent, and current. `allostat init ./your-project` places the real template files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["allostat", "claude", "cursor", "ai", "context", "configuration", "scaffold"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/allostat/allostat"
Issues = "https://github.com/allostat/allostat/issues"

[project.scripts]
allostat = "allostat.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["allostat"]
include-package-data = true

[tool.setuptools.package-data]
allostat = ["templates/**/*"]
